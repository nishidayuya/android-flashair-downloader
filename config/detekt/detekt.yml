# Overrides layered on top of detekt's default rule set
# (buildUponDefaultConfig = true in the root build script).
style:
  MaxLineLength:
    maxLineLength: 120
  UnusedPrivateMember:
    # @Preview composables exist for the IDE to render; nothing calls them.
    ignoreAnnotated: ['Preview']
  MagicNumber:
    # Bit masks, field indexes and the FAT date/time shifts read better as
    # literals right next to the spec they come from (docs/design.md 2.3, 2.4)
    # than as a wall of one-use constants.
    ignorePropertyDeclaration: true
    ignoreLocalVariableDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true

  ReturnCount:
    # Guard clauses ("if the card did not say X, give up on this line") are the
    # house style for parsing and for resolving document trees.
    max: 4

complexity:
  LongParameterList:
    # Compose entry points take one lambda per user action.
    ignoreAnnotated: ['Composable']
    # An injected constructor lists its dependencies; that is not a smell.
    constructorThreshold: 12
  TooManyFunctions:
    ignoreAnnotatedFunctions: ['Composable']

naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][_A-Za-z0-9]*'
