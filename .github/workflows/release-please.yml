name: release-please

on:
  push:
    branches:
      - main

# contents: create the tag, the GitHub release and the release branch.
# pull-requests: open and update the release pull request.
# issues: manage the `autorelease: *` labels, which go through the issues API.
permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release-created: ${{ steps.release.outputs.release_created }}
      tag-name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # The tag is pushed with the default GITHUB_TOKEN, and pushes made with that
  # token do not start workflows, so the tag push above never reaches
  # release-apk.yml on its own: call it here instead.
  release-apk:
    needs: release-please
    if: needs.release-please.outputs.release-created == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release-apk.yml
    with:
      tag: ${{ needs.release-please.outputs.tag-name }}
    secrets: inherit
