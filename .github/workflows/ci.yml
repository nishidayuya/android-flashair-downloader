name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      # Whether a release keystore was available, and so whether the publish
      # job has a signed APK to publish alongside the debug one.
      release-signed: ${{ steps.keystore.outputs.available }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The head of the pull request rather than the merge commit, so that
          # the APK really is the commit its download page is named after.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v4
        with:
          packages: >-
            platforms;android-37.0
            build-tools;37.0.0

      - uses: gradle/actions/setup-gradle@v6

      - run: ./gradlew ktlintCheck detekt test lint assembleDebug

      - name: Look for a release keystore
        id: keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo 'No release keystore is available (secrets are not shared with forks),' \
              'so only the debug APK is built.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build the signed release APK
        if: steps.keystore.outputs.available == 'true'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          RELEASE_KEYSTORE_FILE="$RUNNER_TEMP/release.jks" ./gradlew assembleRelease
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Collect the APKs
        run: |
          mkdir -p apk
          cp app/build/outputs/apk/debug/app-debug.apk apk/
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk apk/
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: apk
          path: apk/

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/
          if-no-files-found: ignore

  publish:
    needs: build
    # A pull request from a fork gets a read-only token, so it cannot be
    # published; the APK is still attached to the run as an artifact.
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    # One publish at a time: each one rewrites the branch it pushes to.
    concurrency:
      group: apk-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/download-artifact@v7
        with:
          name: apk
          path: apk

      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qrencode

      - name: Publish the APKs
        id: publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          PAGES_BASE_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"
          export PAGES_BASE_URL
          export PUBLISH_REMOTE="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          export COMMIT_SUBJECT="$(git log -1 --format=%s "$COMMIT_SHA")"
          apks=(apk/app-debug.apk)
          if [ -f apk/app-release.apk ]; then
            apks+=(apk/app-release.apk)
          fi
          tools/publish_apk_page.sh "${apks[@]}"

      - name: Say where it went
        env:
          PAGE_URL: ${{ steps.publish.outputs.page_url }}
        run: |
          echo "APK: $PAGE_URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on the pull request
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          PAGE_URL: ${{ steps.publish.outputs.page_url }}
          RELEASE_SIGNED: ${{ needs.build.outputs.release-signed }}
        run: |
          {
            echo "The APK for commit \`${COMMIT_SHA:0:7}\` is here:"
            echo
            echo "- [app-debug.apk](${PAGE_URL}app-debug.apk) — signed with a debug key," \
              "installs alongside the release build as \`.debug\`"
            if [ "$RELEASE_SIGNED" = 'true' ]; then
              echo "- [app-release.apk](${PAGE_URL}app-release.apk) — signed with the release key"
            else
              echo "- No release APK: this build had no release keystore" \
                "(secrets are not shared with pull requests from forks)."
            fi
            echo
            echo "Scan to install on a phone, or open [the build page](${PAGE_URL}):"
            echo
            echo "<img src=\"${PAGE_URL}qr.png\" width=\"180\" alt=\"QR code for the build page\">"
          } > comment.md
          gh pr comment "$PR_NUMBER" --body-file comment.md
